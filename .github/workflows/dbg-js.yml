name: Temporary jsdom debug
on:
  push:
    branches: [tmp/claude-jsdom-debug]
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/w" --no-audit --no-fund --ignore-scripts jsdom@26.0.0
      - run: |
          NODE_PATH=$RUNNER_TEMP/w/node_modules timeout 300 node tests/web_structure.cjs > js.txt 2>&1; echo "exit $?" >> js.txt
          python3 -c "d=open('js.txt').read();print('::error title=jsdom::'+d[-6000:].replace('%','%25').replace('\r','').replace('\n','%0A'))"
