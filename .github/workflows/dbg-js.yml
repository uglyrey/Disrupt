name: Temporary jsdom debug
on:
  push:
    branches: [tmp/claude-jsdom-debug]
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/w" --no-audit --no-fund --ignore-scripts jsdom@26.0.0 && tar -C "$RUNNER_TEMP/w" -czf jsdom.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: jsdom
          path: jsdom.tgz
          retention-days: 1
