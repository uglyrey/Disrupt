name: disrupt-notes

x-backend-environment: &backend-environment
  NOTES_DATABASE_HOST: db
  NOTES_DATABASE_PORT: "5432"
  NOTES_DATABASE_USER: notes
  NOTES_DATABASE_NAME: notes
  NOTES_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  NOTES_PROVIDER: cloudru
  NOTES_ALLOW_LIVE_REQUESTS: ${NOTES_ALLOW_LIVE_REQUESTS:-false}
  NOTES_CLOUDRU_MODEL: ${NOTES_CLOUDRU_MODEL:-claude-opus-4.7}
  NOTES_CLOUDRU_BASE_URL: ${NOTES_CLOUDRU_BASE_URL:-https://shared1.multitool.works:4000/v1}
  NOTES_LIVE_CALL_LIMIT: ${NOTES_LIVE_CALL_LIMIT:-100}
  NOTES_LIVE_USER_CALL_LIMIT: ${NOTES_LIVE_USER_CALL_LIMIT:-10}
  NOTES_LLM_READ_TIMEOUT_SECONDS: ${NOTES_LLM_READ_TIMEOUT_SECONDS:-150}
  NOTES_LLM_STREAM: ${NOTES_LLM_STREAM:-false}
  NOTES_DAILY_UNIT_LIMIT: ${NOTES_DAILY_UNIT_LIMIT:-100}
  # Автоповторы ИИ после сбоя шлюза. Делает только воркер. См. docs/ai-reliability-v1.md.
  NOTES_AI_RETRIES_ENABLED: ${NOTES_AI_RETRIES_ENABLED:-true}
  NOTES_RETRY_CLEAR_DELAYS: ${NOTES_RETRY_CLEAR_DELAYS:-60,300}
  NOTES_RETRY_AMBIGUOUS_DELAYS: ${NOTES_RETRY_AMBIGUOUS_DELAYS:-120}
  NOTES_RETRY_BAD_OUTPUT_DELAYS: ${NOTES_RETRY_BAD_OUTPUT_DELAYS:-60}
  NOTES_RETRY_JITTER_PERCENT: ${NOTES_RETRY_JITTER_PERCENT:-20}
  NOTES_RETRY_AFTER_MAX_SECONDS: ${NOTES_RETRY_AFTER_MAX_SECONDS:-900}
  NOTES_RETRY_USER_PER_HOUR: ${NOTES_RETRY_USER_PER_HOUR:-10}
  NOTES_RETRY_GLOBAL_PER_HOUR: ${NOTES_RETRY_GLOBAL_PER_HOUR:-60}
  NOTES_RETRY_BREAKER_FAILURES: ${NOTES_RETRY_BREAKER_FAILURES:-5}
  NOTES_RETRY_BREAKER_WINDOW_SECONDS: ${NOTES_RETRY_BREAKER_WINDOW_SECONDS:-300}
  NOTES_RETRY_BREAKER_PAUSE_SECONDS: ${NOTES_RETRY_BREAKER_PAUSE_SECONDS:-600}
  # Аккаунт моложе суток тратит ИИ не больше этого числа единиц в день. 0 отключает потолок.
  NOTES_NEW_ACCOUNT_UNIT_LIMIT: ${NOTES_NEW_ACCOUNT_UNIT_LIMIT:-100}
  NOTES_GATEWAY_BUDGET_FILE: ${NOTES_GATEWAY_BUDGET_FILE:-}
  NOTES_BUDGET_RESERVE_RUB: ${NOTES_BUDGET_RESERVE_RUB:-25000}
  NOTES_BUDGET_ATTEMPT_RESERVE_RUB: ${NOTES_BUDGET_ATTEMPT_RESERVE_RUB:-250}
  # Резервный ИИ через посредника в Хельсинки. По умолчанию выключен. См. docs/ai-failover-v1.md.
  # Токен посредника получает только воркер, через deploy/compose.ai-failover.yaml.
  NOTES_FALLBACK_ENABLED: ${NOTES_FALLBACK_ENABLED:-false}
  NOTES_FALLBACK_BASE_URL: ${NOTES_FALLBACK_BASE_URL:-}
  NOTES_FALLBACK_MODEL: ${NOTES_FALLBACK_MODEL:-gpt-4o}
  NOTES_FALLBACK_STT_MODEL: ${NOTES_FALLBACK_STT_MODEL-whisper-1}
  NOTES_FALLBACK_DAILY_USD: ${NOTES_FALLBACK_DAILY_USD:-10}
  NOTES_FALLBACK_PRICE_INPUT_PER_M: ${NOTES_FALLBACK_PRICE_INPUT_PER_M:-2.50}
  NOTES_FALLBACK_PRICE_OUTPUT_PER_M: ${NOTES_FALLBACK_PRICE_OUTPUT_PER_M:-10.00}
  NOTES_FALLBACK_PRICE_STT_PER_MINUTE: ${NOTES_FALLBACK_PRICE_STT_PER_MINUTE:-0.006}
  NOTES_FALLBACK_PROBE_SECONDS: ${NOTES_FALLBACK_PROBE_SECONDS:-300}
  NOTES_FALLBACK_FAILURES_TO_DOWN: ${NOTES_FALLBACK_FAILURES_TO_DOWN:-2}
  NOTES_FALLBACK_FAILURE_WINDOW_SECONDS: ${NOTES_FALLBACK_FAILURE_WINDOW_SECONDS:-300}
  # Сколько аккаунтов можно создать с одного адреса за сутки.
  NOTES_REGISTRATIONS_PER_IP_PER_DAY: ${NOTES_REGISTRATIONS_PER_IP_PER_DAY:-20}
  # /docs, /redoc и /openapi.json закрыты. Открывайте только на время отладки.
  NOTES_API_DOCS_ENABLED: ${NOTES_API_DOCS_ENABLED:-false}
  NOTES_TEXT_UNIT_COST: ${NOTES_TEXT_UNIT_COST:-1}
  NOTES_AUDIO_UNIT_BASE: ${NOTES_AUDIO_UNIT_BASE:-2}
  NOTES_AUDIO_UNIT_PER_MINUTE: ${NOTES_AUDIO_UNIT_PER_MINUTE:-1}
  NOTES_LIMIT_TIMEZONE: ${NOTES_LIMIT_TIMEZONE:-Europe/Moscow}
  NOTES_AUTO_WORKER: "false"
  # Шифрование текстов и аудио на диске. Ключ лежит в Docker secret. См. docs/encryption-v1.md.
  NOTES_DATA_ENCRYPTION: required
  NOTES_DATA_KEY_FILE: /run/secrets/data_key
  NOTES_DATA_OLD_KEY_FILES: ${NOTES_DATA_OLD_KEY_FILES:-}
  NOTES_PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
  NOTES_SECURE_COOKIES: "true"
  # Admin: private network only. Set NOTES_ADMIN_COOKIE_SECURE=false in .env.production when the admin
  # is opened over plain HTTP (WireGuard or an SSH tunnel). See docs/admin-security-v1.md.
  NOTES_ADMIN_ALLOWED_NETWORKS: "${NOTES_ADMIN_ALLOWED_NETWORKS:-127.0.0.1/32,::1/128,10.77.0.0/24}"
  NOTES_ADMIN_COOKIE_SECURE: "${NOTES_ADMIN_COOKIE_SECURE:-true}"
  NOTES_ALLOW_REGISTRATION: ${NOTES_ALLOW_REGISTRATION:-true}
  NOTES_TELEGRAM_BOT_USERNAME: ${NOTES_TELEGRAM_BOT_USERNAME:-beresta_ru_bot}
  NOTES_MAIL_ENABLED: ${NOTES_MAIL_ENABLED:-false}
  NOTES_EMAIL_REGISTRATION_ENABLED: ${NOTES_EMAIL_REGISTRATION_ENABLED:-false}
  NOTES_MAIL_TRANSPORT: ${NOTES_MAIL_TRANSPORT:-smtp_bz}
  NOTES_SMTP_BZ_API_KEY_FILE: ${NOTES_SMTP_BZ_API_KEY_FILE:-}
  NOTES_SMTP_HOST: ${NOTES_SMTP_HOST:-}
  NOTES_SMTP_PORT: ${NOTES_SMTP_PORT:-587}
  NOTES_SMTP_USER: ${NOTES_SMTP_USER:-}
  NOTES_SMTP_PASSWORD_FILE: ${NOTES_SMTP_PASSWORD_FILE:-}
  NOTES_MAIL_FROM: ${NOTES_MAIL_FROM:-}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-environment
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    volumes:
      - audio-originals:/app/data/audio
      - ./data/billing:/app/data/billing:ro
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      <<: *backend-environment
      NOTES_ANALYTICS_PSEUDONYM_KEY_FILE: /run/secrets/analytics_pseudonym_key
      NOTES_REVIEW_ENABLED: ${NOTES_REVIEW_ENABLED:-false}
      NOTES_CONTEST_START: ${NOTES_CONTEST_START:-2026-11-03}
      NOTES_CONTEST_END: ${NOTES_CONTEST_END:-2026-11-30}
      NOTES_CONTEST_COUNTED_COMPONENTS: ${NOTES_CONTEST_COUNTED_COMPONENTS:-llm,stt}
    secrets:
      - postgres_password
      - analytics_pseudonym_key
      - data_key
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [owner-live]
    build: .
    volumes:
      - audio-originals:/app/data/audio:ro
      - ./data/billing:/app/data/billing:ro
    restart: "no"
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      NOTES_CLOUDRU_API_KEY_FILE: /run/secrets/cloudru_api_key
      NOTES_STT_ENABLED: ${NOTES_STT_ENABLED:-false}
      NOTES_STT_PROTOCOL_CONFIRMED: ${NOTES_STT_PROTOCOL_CONFIRMED:-false}
      NOTES_STT_MODEL: ${NOTES_STT_MODEL:-}
    secrets:
      - postgres_password
      - data_key
      - cloudru_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    environment:
      <<: *backend-environment
      NOTES_PROVIDER: mock
      NOTES_ALLOW_LIVE_REQUESTS: "false"
    secrets:
      - postgres_password
      - data_key
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

secrets:
  data_key:
    file: ./secrets/data_key.txt
  analytics_pseudonym_key:
    file: ./secrets/analytics_pseudonym_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  cloudru_api_key:
    file: ./secrets/cloudru_api_key.txt

volumes:
  audio-originals:
  postgres-data:
  caddy-data:
  caddy-config:
