# Standalone bot host. No core and no DB. The optional ai-relay profile holds a provider key.
services:
  telegram:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.telegram
    environment:
      BERESTA_BOT_NETWORK_ENABLED: ${BERESTA_BOT_NETWORK_ENABLED:-false}
      BERESTA_BOT_TOKEN_FILE: /run/secrets/telegram_token
      BERESTA_SERVICE_TOKEN_FILE: /run/secrets/telegram_service_token
      BERESTA_CORE_URL: http://${CORE_VPN_IP:?Set private WireGuard address of core}:18000
      BERESTA_WEB_URL: ${BERESTA_WEB_URL:-https://example.invalid}
      BERESTA_BOT_STATE_FILE: /app/data/telegram-offset.json
    secrets:
      - telegram_token
      - telegram_service_token
    volumes:
      - telegram_state:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  # Reserve AI relay. Starts only with --profile ai-relay and listens only on the WireGuard address of this host.
  ai-relay:
    profiles: [ai-relay]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai-relay
    environment:
      AI_RELAY_TOKEN_FILE: /run/secrets/ai_relay_token
      AI_RELAY_API_KEY_FILE: /run/secrets/ai_provider_api_key
      AI_RELAY_PROVIDER: ${AI_RELAY_PROVIDER:-openai}
      AI_RELAY_CHAT_MODELS: ${AI_RELAY_CHAT_MODELS:-gpt-4o}
      AI_RELAY_STT_MODELS: ${AI_RELAY_STT_MODELS-whisper-1}
      AI_RELAY_PER_MINUTE: ${AI_RELAY_PER_MINUTE:-60}
      AI_RELAY_HOST: 0.0.0.0
      AI_RELAY_PORT: "18100"
    secrets:
      - ai_relay_token
      - ai_provider_api_key
    ports:
      - "${BOT_VPN_IP:-10.77.0.2}:18100:18100"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
secrets:
  ai_relay_token:
    file: ../secrets/ai_relay_token.txt
  ai_provider_api_key:
    file: ${AI_RELAY_API_KEY_HOST_FILE:-../secrets/openai_api_key.txt}
  telegram_token:
    file: ../secrets/telegram_token.txt
  telegram_service_token:
    file: ../secrets/telegram_service_token.txt
volumes:
  telegram_state:
